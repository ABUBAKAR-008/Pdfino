<div class="pf-dropzone" data-dropzone data-file-list-target="#pf-file-list">
  <i class="fa-solid fa-cloud-arrow-up pf-drop-icon"></i>
  <h4>Drag & drop your {{ accept_label|default:"files" }} here</h4>
  <p>or click to browse - you can add multiple files and reorder them below</p>
  <input type="file" name="{{ field_name|default:'files' }}" accept="{{ accept|default:'.pdf' }}" multiple required>
</div>
<div class="pf-file-list" id="pf-file-list"></div>
<p class="pf-hint"><i class="fa-solid fa-arrows-up-down"></i> Drag files in the list to change their order.</p>
